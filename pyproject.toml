[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rs_rtc"
version = "0.1.0"
description = "Resampling-based Real-Time Chunking for inference-only static-graph NPUs"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pyyaml",
    "pandas",
    "pyarrow",
    "gym-pusht",
    "imageio[ffmpeg]",
    "mujoco",
]

[tool.setuptools.packages.find]
where = ["src"]
