# NPU 비동기 실행 평가: 역전파 없는 방법 × 지연 d (scripts/eval_npu.py)
# 에피소드·seed·지연은 eval_gpu.yaml 과 동일하게 유지한다.

# 평가 에피소드 (env seed = seed_start + 에피소드 번호, 모든 방법 공통)
episodes: 50
seed_start: 100000
max_episode_steps: 300
sampler_seed: 0
npu_device: 0
# 프로세스당 torch CPU 스레드 (병렬 실행 시 경합 방지)
cpu_threads: 4

# 지연 d (제어 스텝, 0 = 동기 실행과 동일, 최대 7)
delays: [0, 1, 2, 4, 7]

# 방법 정의 (type: vanilla | replacement | bid | rs_rtc)
#   particles: NPU 고정 batch (results/compiled/pusht_unet_b{particles}.rbln)
#   eta: DDIM 확률성 (0 = 결정적)
#   execute_steps: cycle 당 실행 스텝 s (생략 시 정책 설정 8), delays: 이 방법만 쓸 지연 목록 (생략 시 위 delays)
methods:
  naive_async:
    type: vanilla
    particles: 1
    eta: 0.0
  bid_n64:
    type: bid
    particles: 64
    eta: 0.0
  rs_rtc_n64:
    type: rs_rtc
    particles: 64
    eta: 0.5
    guidance_strength: 1000.0
    ess_threshold: 0.5
    use_replacement: false
  per_step:
    type: vanilla
    particles: 1
    eta: 0.0
    execute_steps: 1
    delays: [0]
