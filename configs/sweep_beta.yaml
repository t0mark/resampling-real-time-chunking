# RTC 가이던스 가중치 β 선택 (검증 seed, d=4): 본 실험(eval_async.yaml) 전에 β 1개를 고른다 (scripts/eval_async.py)
# 본 실험 seed (100000~) 와 겹치지 않는 검증 seed 사용, RS-RTC λ 선택(sweep_lambda.yaml)과 같은 조건

episodes: 50
seed_start: 200000
max_episode_steps: 300
sampler_seed: 0
# 실행 장치 (RTC 역전파 → cuda), CUDA 장치 번호
backend: cuda
device_index: 0
cpu_threads: 4
# 결과 폴더 (results/metrics/{metrics_subdir}/)
metrics_subdir: sweep_beta_val

delays: [4]

methods:
  rtc_vjp_b5:
    type: rtc_vjp
    eta: 0.0
    guidance_weight: 5.0
  rtc_vjp_b10:
    type: rtc_vjp
    eta: 0.0
    guidance_weight: 10.0
  rtc_vjp_b20:
    type: rtc_vjp
    eta: 0.0
    guidance_weight: 20.0
  rtc_vjp_b40:
    type: rtc_vjp
    eta: 0.0
    guidance_weight: 40.0
  rtc_vjp_b80:
    type: rtc_vjp
    eta: 0.0
    guidance_weight: 80.0
  rtc_paper_b5:
    type: rtc_paper
    eta: 0.0
    guidance_weight: 5.0
  rtc_paper_b10:
    type: rtc_paper
    eta: 0.0
    guidance_weight: 10.0
  rtc_paper_b20:
    type: rtc_paper
    eta: 0.0
    guidance_weight: 20.0
  rtc_paper_b50:
    type: rtc_paper
    eta: 0.0
    guidance_weight: 50.0
