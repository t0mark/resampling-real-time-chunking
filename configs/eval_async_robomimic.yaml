# robomimic 비동기 실행 평가: 방법 × 지연 d (scripts/eval_async.py --config configs/eval_async_robomimic.yaml)
# 결과: results/metrics/eval_async_{task}/{방법}_d{지연}.csv. 방법 정의 형식은 eval_async.yaml 과 같다.

# 과제 (square_ph | tool_hang_ph, --task 로 대체 가능), DDIM step 수
task: square_ph
num_inference_steps: 10

# 평가 에피소드 (env seed = seed_start + 에피소드 번호, 모든 방법 공통)
# 최대 step 은 체크포인트 평가 설정값 (square 400, tool_hang 700)
episodes: 200
seed_start: 4300000
sampler_seed: 0
# 기본 실행 장치, NPU 장치 번호, 프로세스당 torch CPU 스레드
backend: npu
device_index: 0
cpu_threads: 4

# 지연 d (제어 스텝, 0 = 동기 실행과 동일, 최대 7)
delays: [0, 1, 2, 4, 7]

# 방법 정의 (NPU, 순전파만 사용, 항목 설명은 eval_async.yaml)
methods:
  naive_async:
    type: vanilla
    particles: 1
    eta: 0.0
  naive_async_eta05:
    type: vanilla
    particles: 1
    eta: 0.5
  bid_n64:
    type: bid
    particles: 64
    eta: 0.0
  bid_n64_eta05:
    type: bid
    particles: 64
    eta: 0.5
  rs_rtc_n64:
    type: rs_rtc
    particles: 64
    eta: 0.5
    guidance_strength: 1000.0
    ess_threshold: 0.5
    use_replacement: false
  rs_rtc_kf_n64:
    type: rs_rtc
    particles: 64
    eta: 0.5
    guidance_strength: 1000.0
    ess_threshold: 0.5
    use_replacement: false
    kalman_move: true
    kalman_scale: 100.0
  # 확정 구간만 일치 가중치 (미실행 감쇠 구간 0)
  bid_n64_eta05_frozen:
    type: bid
    particles: 64
    eta: 0.5
    frozen_only: true
  rs_rtc_n64_frozen:
    type: rs_rtc
    particles: 64
    eta: 0.5
    guidance_strength: 1000.0
    ess_threshold: 0.5
    use_replacement: false
    frozen_only: true
  rs_rtc_kf_n64_frozen:
    type: rs_rtc
    particles: 64
    eta: 0.5
    guidance_strength: 1000.0
    ess_threshold: 0.5
    use_replacement: false
    kalman_move: true
    kalman_scale: 100.0
    frozen_only: true
